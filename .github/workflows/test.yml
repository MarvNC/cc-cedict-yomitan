name: Test converter

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: bun test
      - run: bun run typecheck
      - name: Fetch dictionary source data
        run: bun run fetch
      - name: Build trial dictionaries
        run: bun run start
      - name: Prepare directly importable trial artifacts
        run: python3 scripts/prepare_trial_artifacts.py build trial-artifacts
      - name: Upload CC-CEDICT
        uses: actions/upload-artifact@v4
        with:
          name: CC-CEDICT
          path: trial-artifacts/CC-CEDICT/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Upload CC-CEDICT.Zhuyin
        uses: actions/upload-artifact@v4
        with:
          name: CC-CEDICT.Zhuyin
          path: trial-artifacts/CC-CEDICT.Zhuyin/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Upload CC-CEDICT.Hanzi
        uses: actions/upload-artifact@v4
        with:
          name: CC-CEDICT.Hanzi
          path: trial-artifacts/CC-CEDICT.Hanzi/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Upload CC-CEDICT.Canto
        uses: actions/upload-artifact@v4
        with:
          name: CC-CEDICT.Canto
          path: trial-artifacts/CC-CEDICT.Canto/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Upload CC-Canto
        uses: actions/upload-artifact@v4
        with:
          name: CC-Canto
          path: trial-artifacts/CC-Canto/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
