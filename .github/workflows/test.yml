name: Test converter

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - name: Fetch dictionary source data
        run: bun run fetch
      - name: Build trial dictionaries
        run: bun run start
      - name: Record checksums
        run: cd build && sha256sum *.zip > SHA256SUMS.txt
      - name: Upload trial dictionaries
        uses: actions/upload-artifact@v4
        with:
          name: yomitan-trial-dictionaries
          path: |
            build/*.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
